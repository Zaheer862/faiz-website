<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800"><defs>
  <linearGradient id="ti" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8d939c"/><stop offset="0.35" stop-color="#3a3f47"/><stop offset="0.6" stop-color="#20242a"/><stop offset="1" stop-color="#6c727b"/>
  </linearGradient>
  <linearGradient id="tiLight" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#d9dde3"/><stop offset="0.4" stop-color="#8a9099"/><stop offset="0.7" stop-color="#5b616a"/><stop offset="1" stop-color="#c9ced5"/>
  </linearGradient>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1b1f26"/><stop offset="1" stop-color="#0b0e13"/>
  </linearGradient>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1b3a"/><stop offset="0.45" stop-color="#1a3d7a"/><stop offset="0.7" stop-color="#5b3ea6"/><stop offset="1" stop-color="#d6b986"/>
  </linearGradient>
  <linearGradient id="wall2" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#071226"/><stop offset="0.5" stop-color="#0e3a5a"/><stop offset="1" stop-color="#7ab8d9"/>
  </linearGradient>
  <radialGradient id="orb" cx="0.7" cy="0.25" r="0.7">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="0.35" stop-color="#d6b986" stop-opacity="0.35"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0.16"/><stop offset="0.45" stop-color="#fff" stop-opacity="0.02"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="lens" cx="0.35" cy="0.3" r="0.8">
    <stop offset="0" stop-color="#3a4250"/><stop offset="0.5" stop-color="#0b0e13"/><stop offset="1" stop-color="#000"/>
  </radialGradient>
  <radialGradient id="lensIn" cx="0.4" cy="0.35" r="0.7">
    <stop offset="0" stop-color="#2d5b8f"/><stop offset="0.6" stop-color="#0a1626"/><stop offset="1" stop-color="#000"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="drop" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/></filter>
  
  <linearGradient id="white" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#e6e9ee"/><stop offset="1" stop-color="#b9bfc8"/></linearGradient>
  <linearGradient id="blueLight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd0ff"/><stop offset="1" stop-color="#1e6dd8"/></linearGradient>

</defs>
<g filter="url(#drop)">
  <!-- back fin -->
  <path d="M232 60 C 232 40, 262 40, 262 60 L 262 610 C 262 640, 232 640, 232 610 Z" fill="url(#white)"/>
  <!-- centre black core -->
  <path d="M262 70 L 338 70 L 338 620 L 262 620 Z" fill="#0b0e13"/>
  <rect x="262" y="70" width="76" height="550" fill="url(#gloss)"/>
  <!-- front fin, taller, curving outward -->
  <path d="M338 50 C 338 20, 380 20, 380 50 L 386 200 C 392 380, 392 500, 380 640 C 380 668, 338 668, 338 640 Z" fill="url(#white)"/>
  <path d="M338 50 C 338 20, 380 20, 380 50 L 386 200 C 392 380, 392 500, 380 640 C 380 668, 338 668, 338 640 Z" fill="url(#gloss)"/>
  <!-- light strip -->
  <rect x="334" y="80" width="5" height="520" rx="2.5" fill="url(#blueLight)" opacity="0.95"/>
  <rect x="330" y="80" width="13" height="520" rx="6" fill="#4fb3ff" opacity="0.25" filter="url(#soft)"/>
  <!-- base -->
  <ellipse cx="310" cy="668" rx="120" ry="14" fill="#0b0e13"/>
  <ellipse cx="310" cy="666" rx="120" ry="14" fill="url(#gloss)"/>
</g>
<!-- controller -->
<g filter="url(#drop)" transform="translate(120 560) scale(1.15)">
  <path d="M20 40 C 20 10, 60 0, 90 8 L 210 8 C 240 0, 280 10, 280 40 L 292 110 C 296 140, 270 150, 250 130 L 222 100 L 78 100 L 50 130 C 30 150, 4 140, 8 110 Z" fill="url(#white)"/>
  <path d="M60 22 L 240 22 C 262 22, 262 96, 240 96 L 60 96 C 38 96, 38 22, 60 22 Z" fill="#0b0e13"/>
  <rect x="86" y="30" width="128" height="30" rx="8" fill="#1b1f26"/>
  <rect x="110" y="34" width="80" height="4" rx="2" fill="url(#blueLight)" opacity="0.9"/>
  <circle cx="106" cy="86" r="17" fill="#1b1f26"/><circle cx="106" cy="86" r="9" fill="#2a2f37"/>
  <circle cx="194" cy="86" r="17" fill="#1b1f26"/><circle cx="194" cy="86" r="9" fill="#2a2f37"/>
  <g fill="#3a3f47"><rect x="44" y="52" width="10" height="26" rx="3"/><rect x="36" y="60" width="26" height="10" rx="3"/></g>
  <g fill="#3a3f47"><circle cx="248" cy="52" r="5"/><circle cx="248" cy="78" r="5"/><circle cx="235" cy="65" r="5"/><circle cx="261" cy="65" r="5"/></g>
</g>
</svg>